<div class="min-h-screen" style="background-color: #F5F7FA;">
    <div class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="px-4 lg:px-8 py-4 lg:py-6">
            <h2 class="text-2xl font-bold mb-4 lg:mb-6" style="color: #1A237E;">Explore Items</h2>

            <div class="relative max-w-2xl">
                <lucide-icon [img]="SearchIcon"
                    class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 w-5 h-5"></lucide-icon>
                <input placeholder="Find items near you"
                    class="flex w-full bg-background ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 pl-14 pr-4 h-12 lg:h-14 rounded-xl border border-slate-200 text-sm"
                    style="outline-color: #3949AB;" />
            </div>

            <div class="flex gap-2 overflow-x-auto mt-4 lg:mt-6 pb-2 -mx-4 px-4 lg:mx-0 lg:px-0 scrollbar-hide">
                @for (category of categories; track category) {
                <div class="inline-flex items-center rounded-full border px-4 py-2 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 whitespace-nowrap cursor-pointer"
                    [class.border-transparent]="category === 'All'" [class.text-white]="category === 'All'"
                    [class.shadow]="category === 'All'" [class.border-slate-300]="category !== 'All'"
                    [class.text-slate-700]="category !== 'All'" [class.hover:bg-slate-100]="category !== 'All'"
                    [style.background-color]="category === 'All' ? '#3949AB' : ''">
                    {{ category }}
                </div>
                }
            </div>
        </div>
    </div>

    <div class="px-4 lg:px-8 py-6 lg:py-8">
        <div class="flex items-center justify-between mb-6">
            <p class="text-slate-600">
                {{ items.length }} items available nearby
            </p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 lg:gap-6">
            @for (item of items; track item.id) {
            <div (click)="handleItemClick(item.id!)"
                class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-all cursor-pointer hover:-translate-y-1">
                <div class="relative aspect-square">
                    <img [src]="item.imageUrls && item.imageUrls.length > 0 ? item.imageUrls[0] : 'assets/placeholder-image.jpg'"
                        [alt]="item.title" class="w-full h-full object-cover" (error)="handleImageError($event)" />

                    <div class="absolute top-3 right-3">
                        <span
                            class="inline-flex items-center rounded-full border border-transparent px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 text-white"
                            style="background-color: #C6FF00; color: #1A237E;">
                            {{ item.condition }}
                        </span>
                    </div>
                </div>

                <div class="p-4">
                    <h3 class="font-semibold text-slate-900 mb-2 truncate">{{ item.title }}</h3>
                    <div class="flex items-center text-slate-500 text-sm">
                        <lucide-icon [img]="MapPinIcon" class="w-4 h-4 mr-1"></lucide-icon>
                        <span>{{ item.location }}</span>
                    </div>
                    <div class="mt-2 font-bold text-[#3949AB]">
                        {{ item.pricePerDay | currency:'EGP' }} / {{ item.priceUnit }}
                    </div>
                </div>
            </div>
            }
        </div>
    </div>

    <button (click)="handleAddItem()"
        class="lg:hidden fixed bottom-6 right-6 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center transition-colors hover:bg-[#303F9F]"
        style="background-color: #3949AB;">
        <lucide-icon [img]="PlusIcon" class="w-6 h-6"></lucide-icon>
    </button>
</div>
