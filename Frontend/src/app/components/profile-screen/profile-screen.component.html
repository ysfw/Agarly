<div class="min-h-screen bg-slate-50">
    <div class="sticky top-0 z-10 bg-white border-b border-slate-200">
        <div class="px-4 lg:px-8 py-4 flex items-center justify-between">
            <h2 class="font-semibold text-lg">Profile</h2>
            <button class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                <lucide-icon [img]="SettingsIcon" class="w-5 h-5 text-slate-700"></lucide-icon>
            </button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 lg:px-8 py-6 lg:py-8">
        <div class="bg-white rounded-2xl px-6 py-8 text-center border border-slate-200 mb-6">
            <div class="relative flex h-24 w-24 shrink-0 overflow-hidden rounded-full mx-auto mb-4">
                <div
                    class="flex h-full w-full items-center justify-center rounded-full bg-muted bg-emerald-600 text-white text-2xl">
                    JD
                </div>
            </div>

            <h2 class="text-xl font-bold text-slate-900 mb-1">John Doe</h2>
            <p class="text-slate-600 mb-3">Member since Oct 2025</p>

            <div class="flex items-center justify-center gap-2 mb-4">
                <lucide-icon [img]="ShieldIcon" class="w-4 h-4 text-emerald-600"></lucide-icon>
                <span class="text-emerald-700 text-sm font-medium">Verified Member</span>
            </div>

            <div class="flex justify-center gap-8 mt-6">
                <div class="text-center">
                    <div class="flex items-center justify-center gap-1 mb-1">
                        <lucide-icon [img]="StarIcon" class="w-4 h-4 text-amber-500 fill-amber-500"></lucide-icon>
                        <p class="font-bold text-slate-900">4.9</p>
                    </div>
                    <p class="text-slate-500 text-xs">Rating</p>
                </div>
                <div class="text-center">
                    <p class="font-bold text-slate-900 mb-1">24</p>
                    <p class="text-slate-500 text-xs">Items Shared</p>
                </div>
                <div class="text-center">
                    <p class="font-bold text-slate-900 mb-1">18</p>
                    <p class="text-slate-500 text-xs">Items Borrowed</p>
                </div>
            </div>
        </div>

        <div class="space-y-6">

            <div>
                <h3 class="font-semibold text-slate-900 mb-4">Achievements</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white rounded-xl p-6 text-center border border-slate-200">
                        <div class="text-3xl mb-3">🤝</div>
                        <p class="font-medium text-slate-900">Good Neighbor</p>
                        <p class="text-slate-500 text-sm mt-1">10+ shares</p>
                    </div>
                    <div class="bg-white rounded-xl p-6 text-center border border-slate-200">
                        <div class="text-3xl mb-3">⭐</div>
                        <p class="font-medium text-slate-900">Top Rated</p>
                        <p class="text-slate-500 text-sm mt-1">4.5+ rating</p>
                    </div>
                    <div class="bg-white rounded-xl p-6 text-center border border-slate-200">
                        <div class="text-3xl mb-3">🌱</div>
                        <p class="font-medium text-slate-900">Eco Warrior</p>
                        <p class="text-slate-500 text-sm mt-1">20+ borrows</p>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="font-semibold text-slate-900 mb-4">Settings</h3>
                <div class="bg-white rounded-xl overflow-hidden border border-slate-200">
                    <button (click)="navigateTo('/edit-profile')"
                        class="w-full px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors border-b border-slate-100">
                        <span class="text-slate-900 font-medium">Edit Profile</span>
                        <span class="text-slate-400 text-xl">›</span>
                    </button>
                    <button (click)="navigateTo('/settings')"
                        class="w-full px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors border-b border-slate-100">
                        <span class="text-slate-900 font-medium">Notifications</span>
                        <span class="text-slate-400 text-xl">›</span>
                    </button>
                    <button (click)="navigateTo('/privacy-safety')"
                        class="w-full px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors border-b border-slate-100">
                        <span class="text-slate-900 font-medium">Privacy & Safety</span>
                        <span class="text-slate-400 text-xl">›</span>
                    </button>
                    <button (click)="navigateTo('/support')"
                        class="w-full px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                        <span class="text-slate-900 font-medium">Help & Support</span>
                        <span class="text-slate-400 text-xl">›</span>
                    </button>
                </div>
            </div>

            <button (click)="logout()"
                class="inline-flex items-center justify-center whitespace-nowrap rounded-xl text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input bg-background hover:text-accent-foreground w-full border-red-200 text-red-600 hover:bg-red-50 h-12">
                Log Out
            </button>
        </div>
    </div>
</div>
