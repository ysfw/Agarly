<div class="min-h-screen w-full bg-[#F5F7FA] flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-[#3949AB] mb-2">Agarly</h1>
      <p class="text-lg text-gray-600">Welcome back!</p>
    </div>
    <div class="bg-white rounded-2xl p-8 shadow-sm">
      <h2 class="text-2xl font-bold text-[#1A237E] mb-6">Log In</h2>

      <form (ngSubmit)="handleSubmit()" class="space-y-6">
        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Email</label>
          <div class="relative">
            <lucide-icon [img]="MailIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="email"
                   [(ngModel)]="formData.email"
                   (ngModelChange)="ngOnChange('email')"
                   name="email"
                   placeholder="  your@email.com"
                   class="w-full pl-14 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]"
                   required />
          </div>
          @if (errors.email) {
            <p class="error text-red-500 text-sm mt-1">{{ errors.email }}</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Password</label>
          <div class="relative">
            <lucide-icon [img]="LockIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input [type]="showPassword ? 'text' : 'password'"
                   [(ngModel)]="formData.password"
                   (ngModelChange)="ngOnChange('password')"
                   name="password"
                   placeholder="  Enter your password"
                   class="w-full pl-14 pr-14 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]"
                   required />
            <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
              <lucide-icon [img]="showPassword ? EyeOffIcon : EyeIcon" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
          @if (errors.password) {
            <p class="error text-red-500 text-sm mt-1">{{ errors.password }}</p>
          }
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full px-6 py-3 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors shadow-md"
                [disabled]="loading">
          @if (!loading) {
            <span>Log In</span>
          } @else {
            <span>Logging In...</span>
          }
        </button>
        @if (backendError) {
          <p class="text-red-600 mt-2 text-center">{{ backendError }}</p>
        }
        
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">Or continue with</span>
          </div>
        </div>

        <div class="relative w-full group">
          <!-- Custom Visual Button -->
          <div class="w-full px-6 py-3 bg-white border-2 border-gray-200 rounded-xl flex items-center justify-center gap-3 cursor-pointer group-hover:bg-gray-50 transition-colors shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span class="text-[#1A237E] font-semibold">Sign in with Google</span>
          </div>
          
          <!-- Hidden Google Button Overlay -->
          <div id="google-button" class="absolute inset-0 opacity-0 z-10 flex items-center justify-center overflow-hidden"></div>
        </div>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-600">
          Don't have an account?
          <button routerLink="/register" class="text-[#3949AB] font-semibold hover:underline">Sign Up</button>
        </p>
        <!--<button (click)="goToForgot()" class="mt-2 text-sm text-gray-500 hover:text-[#3949AB]">Forgot Password?</button>-->
        <div class="mt-4 text-center">
          <button 
            routerLink="/admin-login" 
            class="text-sm text-gray-500 hover:text-[#3949AB] underline"
          >
            Admin Login
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
