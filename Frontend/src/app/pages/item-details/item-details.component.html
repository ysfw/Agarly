<div class="min-h-screen w-full bg-[#F5F7FA]">
  <app-navbar></app-navbar>
  <div class="max-w-4xl mx-auto px-6 py-8">
    <button (click)="goBack()" class="flex items-center gap-2 text-gray-600 hover:text-[#1A237E] mb-6 transition-colors">
      <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5"></lucide-icon>
      <span class="font-semibold">Back</span>
    </button>
    @if (item) {
      <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
        <div class="relative h-96">
          <img [src]="item.image" [alt]="item.name" class="w-full h-full object-cover" />
          <div class="absolute top-6 right-6 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full font-bold text-[#1A237E] shadow-sm">
            {{ item.price }}
          </div>
        </div>
        <div class="p-8">
          <div class="flex items-start justify-between mb-6">
            <div>
              <h1 class="text-3xl font-bold text-[#1A237E] mb-2">{{ item.name }}</h1>
              <div class="flex items-center gap-2 text-gray-600">
                <lucide-icon [img]="MapPinIcon" class="w-4 h-4"></lucide-icon>
                <span>{{ item.distance }} • {{ item.location }}</span>
              </div>
            </div>
            <div class="flex gap-3">
              <button class="p-3 rounded-full border-2 border-gray-100 hover:border-[#3949AB] hover:text-[#3949AB] transition-colors">
                <lucide-icon [img]="HeartIcon" class="w-6 h-6"></lucide-icon>
              </button>
              <button class="p-3 rounded-full border-2 border-gray-100 hover:border-[#3949AB] hover:text-[#3949AB] transition-colors">
                <lucide-icon [img]="Share2Icon" class="w-6 h-6"></lucide-icon>
              </button>
            </div>
          </div>
          <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-2xl mb-8">
            <img [src]="item.ownerImage" [alt]="item.owner" class="w-12 h-12 rounded-full object-cover" />
            <div class="flex-1">
              <h3 class="font-bold text-[#1A237E]">{{ item.owner }}</h3>
              <div class="flex items-center gap-1 text-yellow-500">
                <lucide-icon [img]="StarIcon" class="w-4 h-4 fill-current"></lucide-icon>
                <span class="text-sm font-bold text-gray-700">{{ item.rating }}</span>
              </div>
            </div>
            <button class="px-4 py-2 bg-white border-2 border-[#3949AB] text-[#3949AB] rounded-xl font-semibold hover:bg-[#3949AB] hover:text-white transition-colors">
              View Profile
            </button>
          </div>
          <div class="mb-8">
            <h3 class="text-xl font-bold text-[#1A237E] mb-4">Description</h3>
            <p class="text-gray-600 leading-relaxed">
              {{ item.description }}
            </p>
          </div>
          <div class="flex gap-4">
            <button class="flex-1 bg-[#3949AB] text-white py-4 rounded-xl font-bold text-lg hover:bg-[#303F9F] transition-colors shadow-lg shadow-[#3949AB]/20">
              Request to Borrow
            </button>
            <button (click)="startChat()" class="px-6 bg-[#C6FF00] text-[#1A237E] rounded-xl font-bold hover:bg-[#B2FF59] transition-colors">
              <lucide-icon [img]="MessageCircleIcon" class="w-6 h-6"></lucide-icon>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
