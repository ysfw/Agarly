<div class="min-h-screen w-full bg-[#F5F7FA]">
  <app-navbar></app-navbar>
  <div class="max-w-7xl mx-auto px-6 py-8">
    <div class="mb-8">
      <div class="relative max-w-2xl mx-auto">
        <lucide-icon [img]="SearchIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
        <input type="text" placeholder="Find items near you" [(ngModel)]="searchQuery" 
               class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E] text-lg" (keyup.enter)="handleSearch()">
      </div>
    </div>
    <div class="bg-gradient-to-r from-[#3949AB] to-[#5E35B1] rounded-2xl p-6 mb-8 shadow-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
            <lucide-icon [img]="MessageSquareIcon" class="w-6 h-6 text-white"></lucide-icon>
          </div>
          <div>
            <h3 class="text-xl font-bold text-white mb-1">
              Can't find what you need?
            </h3>
            <p class="text-white/90">
              Post a request and let neighbors offer their items
            </p>
          </div>
        </div>
        <button (click)="navigateToRequestItem()" class="px-6 py-3 bg-white text-[#3949AB] rounded-xl font-semibold hover:bg-gray-100 transition-colors">
          Post Request
        </button>
      </div>
    </div>
    <div class="flex gap-3 mb-8 overflow-x-auto pb-2">
      @for (category of categories; track category.name) {
        <button (click)="toggleCategory(category.name)"
                class="flex items-center gap-2 px-6 py-3 rounded-full font-semibold whitespace-nowrap transition-colors"
                [ngClass]="selectedCategory === category.name ? 'bg-[#3949AB] text-white' : 'bg-white text-[#1A237E] hover:bg-gray-50'">
          <lucide-icon [img]="category.icon" class="w-5 h-5"></lucide-icon>
          {{ category.name }}
        </button>
      }
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (item of filteredItems; track item.id) {
        <app-item-card [item]="item"></app-item-card>
      }
    </div>
  </div>
  <button (click)="navigateToAddItem()" class="fixed bottom-8 right-8 w-16 h-16 bg-[#C6FF00] rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
    <lucide-icon [img]="PlusIcon" class="w-8 h-8 text-[#1A237E]"></lucide-icon>
  </button>
</div>
