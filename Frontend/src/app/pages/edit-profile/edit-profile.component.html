<div class="min-h-screen w-full bg-[#F5F7FA]">
  <div class="max-w-3xl mx-auto px-6 py-8">
    <div class="flex items-center gap-4 mb-8">
      <button (click)="router.navigate(['/profile'])" class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 rounded-full">
        <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5 text-[#1A237E]"></lucide-icon>
      </button>
      <h1 class="text-3xl font-bold text-[#1A237E]">Edit Profile</h1>
    </div>
    <form (ngSubmit)="handleSubmit()" class="space-y-6">
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h2 class="text-xl font-semibold text-[#1A237E] mb-4">Profile Photo</h2>
        <div class="flex items-center gap-6">
          <div class="w-24 h-24 rounded-full bg-[#3949AB] flex items-center justify-center text-white text-3xl font-bold">JD</div>
          <div>
            <button type="button" class="flex items-center gap-2 px-4 py-2 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors mb-2">
              <lucide-icon [img]="CameraIcon" class="w-4 h-4"></lucide-icon>
              Change Photo
            </button>
            <p class="text-sm text-gray-600">JPG, PNG or GIF. Max size 2MB.</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h2 class="text-xl font-semibold text-[#1A237E] mb-4">Personal Information</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Full Name</label>
            <input type="text" [(ngModel)]="formData.name" name="name" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Email</label>
            <input type="email" [(ngModel)]="formData.email" name="email" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Phone Number</label>
            <input type="tel" [(ngModel)]="formData.phone" name="phone" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Bio</label>
            <textarea [(ngModel)]="formData.bio" name="bio" rows="4" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E] resize-none" placeholder="Tell your neighbors about yourself..."></textarea>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h2 class="text-xl font-semibold text-[#1A237E] mb-4">Address</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Street Address</label>
            <input type="text" [(ngModel)]="formData.address" name="address" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <div class="grid md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-semibold text-[#1A237E] mb-2">City</label>
              <input type="text" [(ngModel)]="formData.city" name="city" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
            </div>
            <div>
              <label class="block text-sm font-semibold text-[#1A237E] mb-2">State</label>
              <input type="text" [(ngModel)]="formData.state" name="state" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
            </div>
            <div>
              <label class="block text-sm font-semibold text-[#1A237E] mb-2">ZIP Code</label>
              <input type="text" [(ngModel)]="formData.zipCode" name="zipCode" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
            </div>
          </div>
        </div>
      </div>
      <div class="flex gap-4">
        <button type="button" (click)="router.navigate(['/profile'])" class="flex-1 px-6 py-4 bg-gray-200 text-[#1A237E] rounded-xl font-semibold hover:bg-gray-300 transition-colors">Cancel</button>
        <button type="submit" class="flex-1 px-6 py-4 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors shadow-md">Save Changes</button>
      </div>
    </form>
  </div>
</div>
