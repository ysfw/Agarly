<div class="min-h-screen w-full bg-[#F5F7FA]">
  <div class="max-w-3xl mx-auto px-6 py-8">
    <div class="flex items-center gap-4 mb-8">
      <button (click)="router.navigate(['/home'])" class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 rounded-full">
        <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5 text-[#1A237E]"></lucide-icon>
      </button>
      <h1 class="text-3xl font-bold text-[#1A237E]">Add New Item</h1>
    </div>
    <form (ngSubmit)="handleSubmit()" class="space-y-6">
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h2 class="text-xl font-semibold text-[#1A237E] mb-4">Item Photos</h2>
        <div class="grid grid-cols-3 gap-4 mb-4">
          @for (image of images; track image; let i = $index) {
            <div class="relative">
              <img [src]="image" [alt]="'Upload ' + (i + 1)" class="w-full h-32 object-cover rounded-xl" />
              <button type="button" (click)="removeImage(i)" class="absolute top-2 right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center hover:bg-red-600">
                <lucide-icon [img]="XIcon" class="w-4 h-4"></lucide-icon>
              </button>
            </div>
          }
          <label class="w-full h-32 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#3949AB] transition-colors">
            <lucide-icon [img]="ImageIcon" class="w-8 h-8 text-gray-400 mb-2"></lucide-icon>
            <span class="text-sm text-gray-500">Add Photo</span>
            <input type="file" accept="image/*" multiple (change)="handleImageUpload($event)" class="hidden" />
          </label>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm">
        <h2 class="text-xl font-semibold text-[#1A237E] mb-4">Item Details</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Item Name</label>
            <input type="text" [(ngModel)]="formData.name" name="name" placeholder="e.g., Power Drill" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Category</label>
            <select [(ngModel)]="formData.category" name="category" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required>
              <option value="">Select a category</option>
              @for (category of categories; track category) {
                <option [value]="category">{{category}}</option>
              }
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Condition</label>
            <select [(ngModel)]="formData.condition" name="condition" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required>
              <option value="excellent">Excellent</option>
              <option value="good">Good</option>
              <option value="fair">Fair</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-[#1A237E] mb-2">Description</label>
            <textarea [(ngModel)]="formData.description" name="description" placeholder="Describe your item, its features, and any special instructions..." rows="4" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E] resize-none" required></textarea>
          </div>
        </div>
      </div>
      <div class="flex gap-4">
        <button type="button" (click)="router.navigate(['/home'])" class="flex-1 px-6 py-4 bg-gray-200 text-[#1A237E] rounded-xl font-semibold hover:bg-gray-300 transition-colors">Cancel</button>
        <button type="submit" class="flex-1 px-6 py-4 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors shadow-md">List Item</button>
      </div>
    </form>
  </div>
</div>
