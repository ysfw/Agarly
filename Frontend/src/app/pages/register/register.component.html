<div class="min-h-screen w-full bg-[#F5F7FA] flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-[#3949AB] mb-2">Agarly</h1>
      <p class="text-lg text-gray-600">Join your community</p>
    </div>
    <div class="bg-white rounded-2xl p-8 shadow-sm">
      <h2 class="text-2xl font-bold text-[#1A237E] mb-6">Sign Up</h2>

      <form (ngSubmit)="handleSubmit()" class="space-y-6">
        <!-- Full Name -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Full Name</label>
          <div class="relative">
            <lucide-icon [img]="UserIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="text" [(ngModel)]="formData.name" (ngModelChange)="ngOnChange('name')" name="name" placeholder="  John Doe" class="w-full pl-14 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <p class="error text-red-500 text-sm mt-1" *ngIf="errors.name">{{ errors.name }}</p>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Email</label>
          <div class="relative">
            <lucide-icon [img]="MailIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="email" [(ngModel)]="formData.email" (ngModelChange)="ngOnChange('email')" name="email" placeholder="  your@email.com" class="w-full pl-14 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <p class="error text-red-500 text-sm mt-1" *ngIf="errors.email">{{ errors.email }}</p>
        </div>

        <!-- Address -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Address</label>
          <div class="relative">
            <lucide-icon [img]="MapPinIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="text" [(ngModel)]="formData.address" (ngModelChange)="ngOnChange('address')" name="address" placeholder="  123 Main Street Downtown City" class="w-full pl-14 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
          <p class="error text-red-500 text-sm mt-1" *ngIf="errors.address">{{ errors.address }}</p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Password</label>
          <div class="relative">
            <lucide-icon [img]="LockIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="formData.password" (ngModelChange)="ngOnChange('password')" name="password" placeholder="  Create a password" class="w-full pl-14 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
             <button type="button" (click)="togglePassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
              <lucide-icon [img]="showPassword ? EyeOffIcon : EyeIcon" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
          <p class="error text-red-500 text-sm mt-1" *ngIf="errors.password">{{ errors.password }}</p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Confirm Password</label>
          <div class="relative">
            <lucide-icon [img]="LockIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="formData.confirmPassword" (ngModelChange)="ngOnChange('confirmPassword')" name="confirmPassword" placeholder="  Confirm your password" class="w-full pl-14 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
             <button type="button" (click)="toggleConfirmPassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
              <lucide-icon [img]="showConfirmPassword ? EyeOffIcon : EyeIcon" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
          <p class="error text-red-500 text-sm mt-1" *ngIf="errors.confirmPassword">{{ errors.confirmPassword }}</p>
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full px-6 py-3 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors shadow-md" [disabled]="loading">
          <span *ngIf="!loading">Create Account</span>
          <span *ngIf="loading">Creating Account...</span>
        </button>
        <p *ngIf="success" class="text-green-600 mt-2 text-center">Account created successfully!</p>
        <p *ngIf="backendError" class="text-red-600 mt-2 text-center">{{ backendError }}</p>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-600">
          Already have an account?
          <button routerLink="/login" class="text-[#3949AB] font-semibold hover:underline">
            Log In
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
