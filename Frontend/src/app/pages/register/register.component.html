<div class="min-h-screen w-full bg-[#F5F7FA] flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-[#3949AB] mb-2">Agarly</h1>
      <p class="text-lg text-gray-600">Join your community</p>
    </div>
    <div class="bg-white rounded-2xl p-8 shadow-sm">
      <h2 class="text-2xl font-bold text-[#1A237E] mb-6">Sign Up</h2>
      
      <form (ngSubmit)="handleSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Full Name</label>
          <div class="relative">
            <lucide-icon [img]="UserIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="text" [(ngModel)]="formData.name" (ngModelChange)="ngOnChange()" name="name" placeholder="John Doe" class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Email</label>
          <div class="relative">
            <lucide-icon [img]="MailIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="email" [(ngModel)]="formData.email" (ngModelChange)="ngOnChange()" name="email" placeholder="your@email.com" class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Address</label>
          <div class="relative">
            <lucide-icon [img]="MapPinIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="text" [(ngModel)]="formData.address" (ngModelChange)="ngOnChange()" name="address" placeholder="123 Main Street" class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Password</label>
          <div class="relative">
            <lucide-icon [img]="LockIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="password" [(ngModel)]="formData.password" (ngModelChange)="ngOnChange()" name="password" placeholder="Create a password" class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Confirm Password</label>
          <div class="relative">
            <lucide-icon [img]="LockIcon" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="password" [(ngModel)]="formData.confirmPassword" (ngModelChange)="ngOnChange()" name="confirmPassword" placeholder="Confirm your password" class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]" required />
          </div>
        </div>

        <button type="submit" class="w-full px-6 py-3 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors shadow-md">
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-600">
          Already have an account?
          <button routerLink="/login" class="text-[#3949AB] font-semibold hover:underline">
            Log In
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
