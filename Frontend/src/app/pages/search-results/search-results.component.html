<div class="min-h-screen w-full bg-[#F5F7FA]">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-4">
        <button (click)="goBack()" class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 rounded-full"
          aria-label="Go back">
          <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5 text-[#1A237E]"></lucide-icon>
        </button>
        <div>
          <h1 class="text-3xl font-bold text-[#1A237E]">Search Results</h1>
          <p class="text-gray-600">{{items.length}} items found</p>
        </div>
      </div>
      <button (click)="showFilters = !showFilters"
        class="flex items-center gap-2 px-6 py-3 bg-white rounded-xl font-semibold text-[#1A237E] hover:bg-gray-50 shadow-sm">
        <lucide-icon [img]="SlidersHorizontalIcon" class="w-5 h-5"></lucide-icon>
        Filters
      </button>
    </div>

    @if (showFilters) {
    <div class="bg-white rounded-2xl p-6 shadow-sm mb-8">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold text-[#1A237E]">Filter Results</h2>
        <button (click)="applyFilters()"
          class="px-6 py-2 bg-[#3949AB] text-white rounded-xl font-semibold hover:bg-[#1A237E] transition-colors shadow-md flex items-center gap-2">
          <lucide-icon [img]="SearchIcon" class="w-4 h-4"></lucide-icon>
          Apply Filters
        </button>
      </div>

      <div class="grid md:grid-cols-3 gap-6">
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Category</label>
          <select [(ngModel)]="filters.category"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]">
            <option [ngValue]="undefined">All Categories</option>
            <option [value]="ItemCategory.TOOLS">Tools</option>
            <option [value]="ItemCategory.KITCHEN">Kitchen</option>
            <option [value]="ItemCategory.CLEANING">Cleaning</option>
            <option [value]="ItemCategory.ELECTRONICS">Electronics</option>
            <option [value]="ItemCategory.SPORTS">Sports</option>
            <option [value]="ItemCategory.GARDEN">Garden</option>
            <option [value]="ItemCategory.OTHER">Other</option>
          </select>
        </div>

        <!-- Location Filter -->
        <div class="space-y-3">
          <label class="block text-sm font-semibold text-[#1A237E]">Location</label>
          <div class="flex gap-2">
            <button (click)="useCurrentLocation()"
              class="flex-1 px-3 py-2 rounded-lg text-sm font-medium transition-colors" [ngClass]="{
                'bg-[#E8EAF6] text-[#3949AB] hover:bg-[#C5CAE9]': !isNearMeActive,
                'bg-[#3949AB] text-white hover:bg-[#1A237E]': isNearMeActive
              }">
              Near Me
            </button>


            <button (click)="openMap()"
              class="flex-1 px-3 py-2 bg-[#E8EAF6] text-[#3949AB] rounded-lg text-sm font-medium hover:bg-[#C5CAE9] transition-colors">
              Pick Map
            </button>
          </div>
          <div *ngIf="filters.latitude && filters.longitude" class="text-xs font-medium flex items-center gap-1"
            [ngClass]="{
              'text-blue-600': isNearMeActive,
              'text-green-600': !isNearMeActive
            }">

            <lucide-icon [img]="MapPinIcon" class="w-3 h-3"></lucide-icon>

            <span *ngIf="isNearMeActive; else mapLocation">
              Using your current location
            </span>

            <ng-template #mapLocation>
              Location selected on map
            </ng-template>
          </div>

          <!-- Clear location -->
          <button *ngIf="filters.latitude && filters.longitude" (click)="clearLocation()"
            class="text-xs text-red-500 underline self-start hover:text-red-600">
            Clear location
          </button>

          <div>
            <label class="text-xs text-gray-500 mb-1 block">Radius: {{filters.radius}} km</label>
            <input type="range" min="1" max="50" [(ngModel)]="filters.radius" class="w-full accent-[#3949AB]">
          </div>

        </div>

        <!-- Price Filter -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Price Range</label>
          <div class="flex gap-2 mb-2">
            <input type="number" [(ngModel)]="filters.minPrice" placeholder="Min"
              class="w-full px-3 py-2 rounded-lg border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-sm">
            <input type="number" [(ngModel)]="filters.maxPrice" placeholder="Max"
              class="w-full px-3 py-2 rounded-lg border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-sm">
          </div>
          <select [(ngModel)]="filters.priceUnit"
            class="w-full px-3 py-2 rounded-lg border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-sm">
            <option [ngValue]="undefined">Any</option>
            <option value="DAY">Per Day</option>
            <option value="HOUR">Per Hour</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Availability</label>
          <select [(ngModel)]="filters.rentalStatus"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]">
            <option [ngValue]="undefined">All Items</option>
            <option [value]="ItemRentalStatus.AVAILABLE">Available Now</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Sort By</label>
          <select [(ngModel)]="filters.sortBy"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]">
            <option [ngValue]="'newest'">Newest</option>
            <option [ngValue]="'price'">Price</option>
            <option [ngValue]="'rating'">Rating</option>
            <option [ngValue]="'distance'">Distance</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Sort Direction</label>
          <select [(ngModel)]="filters.sortDirection"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none text-[#1A237E]">
            <option [ngValue]="'asc'">Ascending</option>
            <option [ngValue]="'desc'">Descending</option>
          </select>
        </div>
      </div>
    </div>

    }

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (item of items; track item.id) {
      <app-item-card [item]="item"></app-item-card>
      }
    </div>
  </div>

  <app-location-picker [isOpen]="isMapOpen" [initialLat]="filters.latitude || undefined"
    [initialLng]="filters.longitude || undefined" (closePicker)="closeMap()"
    (locationPicked)="onLocationPicked($event)">
  </app-location-picker>
</div>
