<div class="min-h-screen w-full bg-[#F5F7FA]">
  <div class="max-w-3xl mx-auto px-6 py-8">
    <div class="flex items-center gap-4 mb-8">
      <button (click)="navigateTo('/profile')" class="w-10 h-10 flex items-center justify-center hover:bg-gray-100 rounded-full">
        <lucide-icon [img]="ArrowLeftIcon" class="w-5 h-5 text-[#1A237E]"></lucide-icon>
      </button>
      <h1 class="text-3xl font-bold text-[#1A237E]">Settings</h1>
    </div>

    <div class="space-y-6">
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="px-6 py-4 border-b border-gray-200">
          <h2 class="text-lg font-semibold text-[#1A237E]">Account</h2>
        </div>
        <button (click)="navigateTo('/edit-profile')" class="w-full px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition-colors border-b border-gray-100">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="UserIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <span class="text-[#1A237E] font-medium">Edit Profile</span>
          </div>
          <lucide-icon [img]="ChevronRightIcon" class="w-5 h-5 text-gray-400"></lucide-icon>
        </button>
        <button (click)="changePassword()" class="w-full px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="ShieldIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <span class="text-[#1A237E] font-medium">Change Password</span>
          </div>
          <lucide-icon [img]="ChevronRightIcon" class="w-5 h-5 text-gray-400"></lucide-icon>
        </button>
      </div>

      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="px-6 py-4 border-b border-gray-200">
          <h2 class="text-lg font-semibold text-[#1A237E]">Notifications</h2>
        </div>
        
        <div class="px-6 py-4 flex items-center justify-between border-b border-gray-100">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="BellIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <div>
              <p class="text-[#1A237E] font-medium">Push Notifications</p>
              <p class="text-sm text-gray-600">Get notified about new messages</p>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" checked />
            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#3949AB]"></div>
          </label>
        </div>

        <div class="px-6 py-4 flex items-center justify-between border-b border-gray-100">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="MailIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <div>
              <p class="text-[#1A237E] font-medium">Email Notifications</p>
              <p class="text-sm text-gray-600">Receive updates via email</p>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" checked />
            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#3949AB]"></div>
          </label>
        </div>

        <div class="px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="MessageSquareIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <div>
              <p class="text-[#1A237E] font-medium">SMS Notifications</p>
              <p class="text-sm text-gray-600">Get text message alerts</p>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" />
            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#3949AB]"></div>
          </label>
        </div>
      </div>

      <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
        <div class="px-6 py-4 border-b border-gray-200">
          <h2 class="text-lg font-semibold text-[#1A237E]">Privacy & Support</h2>
        </div>
        <button (click)="navigateTo('/privacy-safety')" class="w-full px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition-colors border-b border-gray-100">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="ShieldIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <span class="text-[#1A237E] font-medium">Privacy & Safety</span>
          </div>
          <lucide-icon [img]="ChevronRightIcon" class="w-5 h-5 text-gray-400"></lucide-icon>
        </button>
        <button (click)="navigateTo('/support')" class="w-full px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-3">
            <lucide-icon [img]="HelpCircleIcon" class="w-5 h-5 text-[#3949AB]"></lucide-icon>
            <span class="text-[#1A237E] font-medium">Help & Support</span>
          </div>
          <lucide-icon [img]="ChevronRightIcon" class="w-5 h-5 text-gray-400"></lucide-icon>
        </button>
      </div>

      <button (click)="handleLogout()" class="w-full bg-white rounded-2xl px-6 py-4 flex items-center justify-center gap-3 hover:bg-red-50 transition-colors shadow-sm border-2 border-red-200">
        <lucide-icon [img]="LogOutIcon" class="w-5 h-5 text-red-600"></lucide-icon>
        <span class="text-red-600 font-semibold">Log Out</span>
      </button>
    </div>
  </div>
</div>
