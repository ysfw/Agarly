<div
  class="min-h-screen w-full bg-gradient-to-br from-[#F5F7FA] via-[#E8EAF6] to-[#C5CAE9] flex items-center justify-center p-6">
  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <div
        class="w-20 h-20 bg-gradient-to-br from-[#1A237E] to-[#3949AB] rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
        <lucide-icon [img]="ShieldIcon" class="w-10 h-10 text-white"></lucide-icon>
      </div>
      <h1 class="text-4xl font-bold text-[#1A237E] mb-2">Admin Portal</h1>
      <p class="text-lg text-gray-600">Agarly Management System</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white/80 backdrop-blur-sm rounded-3xl p-8 shadow-xl border border-white/50">
      <h2 class="text-2xl font-bold text-[#1A237E] mb-6 text-center">Admin Login</h2>

      <form (ngSubmit)="handleSubmit()" class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Email</label>
          <div class="relative">
            <lucide-icon [img]="MailIcon"
              class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input type="email" [(ngModel)]="formData.email" (ngModelChange)="ngOnChange('email')" name="email"
              placeholder="admin@agarly.com"
              class="w-full pl-14 pr-4 py-4 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none focus:ring-2 focus:ring-[#3949AB]/20 text-[#1A237E] transition-all"
              required />
          </div>
          @if (errors.email) {
          <p class="text-red-500 text-sm mt-2">{{ errors.email }}</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-[#1A237E] mb-2">Password</label>
          <div class="relative">
            <lucide-icon [img]="LockIcon"
              class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="formData.password"
              (ngModelChange)="ngOnChange('password')" name="password" placeholder="Enter your password"
              class="w-full pl-14 pr-14 py-4 rounded-xl border-2 border-gray-200 focus:border-[#3949AB] focus:outline-none focus:ring-2 focus:ring-[#3949AB]/20 text-[#1A237E] transition-all"
              required />
            <button type="button" (click)="togglePassword()"
              class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-[#3949AB] transition-colors">
              <lucide-icon [img]="showPassword ? EyeOffIcon : EyeIcon" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
          @if (errors.password) {
          <p class="text-red-500 text-sm mt-2">{{ errors.password }}</p>
          }
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full py-4 rounded-xl font-bold text-white transition-all shadow-lg flex items-center justify-center gap-3
                       bg-gradient-to-r from-[#1A237E] to-[#3949AB] hover:from-[#0D1642] hover:to-[#1A237E] hover:shadow-xl
                       disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="loading">
          @if (!loading) {
          <lucide-icon [img]="ShieldIcon" class="w-5 h-5"></lucide-icon>
          <span>Access Admin Portal</span>
          } @else {
          <lucide-icon [img]="LoaderIcon" class="w-5 h-5 animate-spin"></lucide-icon>
          <span>Logging In...</span>
          }
        </button>

        @if (backendError) {
        <div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm text-center">
          {{ backendError }}
        </div>
        }
      </form>

      <div class="mt-6 text-center">
        <button routerLink="/login" class="text-sm text-gray-500 hover:text-[#3949AB] transition-colors">
          ← Back to User Login
        </button>
      </div>
    </div>

    <!-- Security Notice -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-500 flex items-center justify-center gap-2">
        <lucide-icon [img]="LockIcon" class="w-3 h-3"></lucide-icon>
        Secure admin access with 2-factor authentication
      </p>
    </div>
  </div>
</div>
